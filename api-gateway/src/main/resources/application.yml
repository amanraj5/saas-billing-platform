server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: tenant-service
          uri: http://localhost:8082
          predicates:
            - Path=/tenants/**

jwt:
  secret: my-secret-key@123#jiuhoierbkioehirenerguieuriowebviuer